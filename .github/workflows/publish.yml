name: publish

# Publishes @create.com/cli to npm (`npx -y @create.com/cli mcp`) with npm Trusted Publishing (OIDC):
# no npm token exists anywhere, and every version carries a provenance statement linking it to this
# repository, this workflow and the commit it was built from.
#
# Release: push a tag v<version> matching packages/cli/package.json (e.g. v0.1.1). The source under
# apps/, infra/ and packages/ is exported from Create's monorepo by packages/cli/scripts/export-public.mjs,
# which checks that this tree builds a byte-identical package before it is committed here.
#
# npmjs.com → @create.com/cli → Settings → Trusted publishing trusts exactly: GitHub Actions,
# Createdotcom / create-mcp, publish.yml, environment npm.
#
# Two jobs, so the publish identity never meets third-party code: `build` installs dependencies and
# builds with no id-token permission; `publish` (environment npm, the only job that can mint the OIDC
# token) checks out nothing and installs nothing from the repository — it hands the packed tarball to npm.

on:
  push:
    tags:
      - 'v*'

concurrency:
  group: publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: The tag is on main and matches the package version
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main."
            exit 1
          fi
          version="$(node -p 'require("./packages/cli/package.json").version')"
          if [ "${GITHUB_REF_NAME#v}" != "$version" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match packages/cli/package.json version ${version}."
            exit 1
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @create.com/cli build
      - name: Smoke test the bundle
        working-directory: packages/cli
        run: |
          node dist/bin.js --help | grep -q 'create mcp\|  mcp ' || { echo "::error::the bundle's --help does not list mcp"; exit 1; }
          # Without a sign-in, `create mcp` must start and refuse with its own error (not crash).
          out="$(node dist/bin.js mcp < /dev/null 2>&1 || true)"
          echo "$out" | grep -q 'not_signed_in' || { echo "::error::create mcp did not start"; echo "$out" | head -c 2000; exit 1; }
      - name: Pack
        working-directory: packages/cli
        run: |
          mkdir -p "$RUNNER_TEMP/cli-pack"
          pnpm pack --pack-destination "$RUNNER_TEMP/cli-pack"
          ls -l "$RUNNER_TEMP/cli-pack"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-tarball
          path: ${{ runner.temp }}/cli-pack/*.tgz
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm
    permissions:
      contents: read
      id-token: write # npm Trusted Publishing exchanges this job's OIDC identity for a one-time publish credential
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: cli-tarball
          path: ${{ runner.temp }}/cli-pack
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1+; Node 22 ships npm 10. --ignore-scripts: nothing runs at install.
      - run: npm install -g --ignore-scripts npm@11.6.2
      - name: Publish to npm (with provenance)
        run: npm publish "$(ls "$RUNNER_TEMP"/cli-pack/*.tgz)" --provenance --access public
